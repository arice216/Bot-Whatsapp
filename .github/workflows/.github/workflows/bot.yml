name: Monitor Website

on:
  schedule:
    - cron: "*/10 * * * *"  # toutes les 10 minutes

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Installer Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Installer dépendances
        run: npm install

      - name: Lancer bot
        run: node bot.js
